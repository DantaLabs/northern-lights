services:
  workiva-mcp:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: northern-lights-workiva-mcp
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/workiva-mcp", "healthcheck", "-url", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
