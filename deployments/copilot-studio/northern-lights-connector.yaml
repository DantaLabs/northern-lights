# Custom connector definition for Copilot Studio (Power Apps > Custom
# connectors > Import OpenAPI). Replace YOUR_TUNNEL_HOST with the current
# Quick Tunnel hostname before importing; see
# docs/copilot-studio-test-runbook.md. Keep this committed copy unchanged
# and put the real host in northern-lights-connector.local.yaml, which is
# git-ignored.
swagger: '2.0'
info:
  title: Northern Lights
  description: Northern Lights MCP server for Workiva
  version: 1.0.0
host: YOUR_TUNNEL_HOST
basePath: /
schemes: [https]
securityDefinitions:
  api_key: {type: apiKey, in: header, name: Authorization}
security:
  - api_key: []
paths:
  /mcp:
    post:
      summary: Northern Lights MCP server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      parameters:
        - {name: nl-actor, in: header, type: string, required: false}
      responses:
        '200':
          description: Success
