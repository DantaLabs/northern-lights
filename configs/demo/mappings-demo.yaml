# Demo-mode mapping: used with NL_DEMO_MODE=true and -mappings configs/demo/mappings-demo.yaml.
# Data is served by internal/workiva/demo_esg.go from NL_DEMO_ESG_DATA (configs/demo/data/*.csv).
# Row 1 of every sheet is the header key | label | unit | value; the field of CSV data row n is D<n+1>.
region: eu
document_id: "demo-doc-annual-report"
spreadsheets:
  - id: "demo-esg-source"
    name: "Demo ESG source 2025"
    sheets:
      - id: "demo-esg-source-2025"
        name: "ESG data 2025"
        fields:
          - { name: src_env_energy_total, range: "D2", field_type: number, description: "Total Energy Consumption" }
          - { name: src_env_electricity_renewable, range: "D3", field_type: number, description: "Electricity (as reflected in utility billings) - Renewable" }
          - { name: src_env_electricity_non_renewable, range: "D4", field_type: number, description: "Electricity (as reflected in utility billings) - Non-renewable" }
          - { name: src_env_self_generated_electricity_renewable, range: "D5", field_type: number, description: "Self-generated electricity - Renewable" }
          - { name: src_env_self_generated_electricity_non_renewable, range: "D6", field_type: number, description: "Self-generated electricity - Non-renewable" }
          - { name: src_env_ghg_scope1, range: "D7", field_type: number, description: "Gross Scope 1 GHG Emissions" }
          - { name: src_env_ghg_scope2_location, range: "D8", field_type: number, description: "Gross Scope 2 location-based GHG Emissions" }
          - { name: src_env_ghg_scope2_market, range: "D9", field_type: number, description: "Gross scope 2 market-based GHG Emissions - May (optional)" }
