          - { name: src_env_ghg_scope3_capital_goods, range: "D11", field_type: number, description: "2. Capital Goods" }
          - { name: src_env_ghg_scope3_fuel_energy, range: "D12", field_type: number, description: "3. Fuel- and Energy-Related Activities (Not Included in Scope 1 or Scope 2)" }
          - { name: src_env_ghg_scope3_upstream_transport, range: "D13", field_type: number, description: "4. Upstream Transportation and Distribution" }
          - { name: src_env_ghg_scope3_waste, range: "D14", field_type: number, description: "5. Waste Generated in Operations" }
          - { name: src_env_ghg_scope3_business_travel, range: "D15", field_type: number, description: "6. Business Travel" }
          - { name: src_env_ghg_scope3_commuting, range: "D16", field_type: number, description: "7. Employee Commuting" }
