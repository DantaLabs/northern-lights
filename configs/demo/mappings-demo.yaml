          - { name: src_env_water_withdrawn_high_stress, range: "D22", field_type: number, description: "Amount of water withdrawn at sites located in areas of high water-stress" }
          - { name: src_env_water_discharge_production, range: "D23", field_type: number, description: "Water discharge from undertaking production processes (m³)" }
